name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-package-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate source and versions
        shell: python
        run: |
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          required = [
              pathlib.Path("modDesc.xml"),
              pathlib.Path("icon_CropCalendarSort.dds"),
              pathlib.Path("scripts/CropCalendarSort.lua"),
          ]

          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Missing required files: " + ", ".join(missing))

          root = ET.parse("modDesc.xml").getroot()
          version = (root.findtext("version") or "").strip()
          if not version:
              raise SystemExit("modDesc.xml has no version")

          lua = pathlib.Path("scripts/CropCalendarSort.lua").read_text(encoding="utf-8")
          match = re.search(r'CCS\.VERSION\s*=\s*"([^"]+)"', lua)
          if match is None:
              raise SystemExit("Could not find CCS.VERSION in CropCalendarSort.lua")

          runtime_version = match.group(1)
          if runtime_version != version:
              raise SystemExit(
                  f"Version mismatch: modDesc.xml={version}, CCS.VERSION={runtime_version}"
              )

          icon = pathlib.Path("icon_CropCalendarSort.dds").read_bytes()
          if icon[:4] != b"DDS ":
              raise SystemExit("icon_CropCalendarSort.dds is not a DDS file")
          if b"DXT5" not in icon[:128]:
              raise SystemExit("icon_CropCalendarSort.dds is not DXT5-compressed")

          print(f"Validated Crop Calendar Sort {version}")

      - name: Package FS25 mod
        run: |
          rm -f FS25_CropCalendarSort.zip
          zip -r FS25_CropCalendarSort.zip \
            modDesc.xml \
            icon_CropCalendarSort.dds \
            scripts
          unzip -t FS25_CropCalendarSort.zip
          test "$(unzip -Z1 FS25_CropCalendarSort.zip | head -n 1)" = "modDesc.xml"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FS25_CropCalendarSort
          path: FS25_CropCalendarSort.zip
          if-no-files-found: error

      - name: Detect release request
        id: release
        shell: bash
        run: |
          echo "publish=false" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            exit 0
          fi

          if [ ! -f .release/READY ]; then
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi

          if ! git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qx ".release/READY"; then
            exit 0
          fi

          VERSION="$(python - <<'PY'
          import xml.etree.ElementTree as ET
          print(ET.parse("modDesc.xml").getroot().findtext("version").strip())
          PY
          )"

          REQUESTED="$(tr -d '[:space:]' < .release/READY)"
          if [ "$REQUESTED" != "$VERSION" ]; then
            echo "Release marker requests '$REQUESTED' but modDesc.xml is '$VERSION'" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi

          gh release create "$TAG" \
            FS25_CropCalendarSort.zip \
            --target "$GITHUB_SHA" \
            --title "Crop Calendar Sort $VERSION" \
            --generate-notes
